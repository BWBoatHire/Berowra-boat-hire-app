<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berowra Waters Boat Hire</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=2">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <h1>Berowra Waters Boat Hire</h1>
  <div id="map"></div>
  <div id="legend"><h4>Map Key</h4></div>

  <button id="locate-btn" onclick="toggleShowLocation()">📍</button>
  <button id="track-btn" onclick="toggleTrackRoute()">🧭</button>

  <!-- Floating menu button -->
  <button id="menu-toggle-btn" onclick="toggleMenu()">☰</button>

  <!-- Bottom sheet panel -->
  <div id="bottom-sheet">
    <div id="bottom-sheet-handle"></div>
    <button id="bottom-sheet-close" onclick="toggleMenu()">✕</button>
    <h3>Menu</h3>

    <div class="menu-section">
      <h4>🗺️ Map Layers</h4>
      <label class="layer-toggle">
        <input type="checkbox" id="layer-official" checked onchange="toggleOfficialLayer()">
        Navigation Markers (port/starboard/cardinal)
      </label>
      <label class="layer-toggle">
        <input type="checkbox" id="layer-wharf-ramp" onchange="toggleWharfRampLayer()">
        Wharves & Boat Ramps
      </label>
      <p><em>More layers coming soon — shallow water, fishing spots.</em></p>
    </div>

    <div class="menu-section">
      <h4>📄 Official Chart</h4>
      <button onclick="openChartViewer()" class="menu-link-btn">View Official Chart (PDF)</button>
    </div>

    <div class="menu-section">
      <h4>🌊 Tide Timetable</h4>
      <p><em>Coming soon</em></p>
    </div>

    <div class="menu-section">
      <h4>☀️ Marine Weather</h4>
      <p><em>Coming soon</em></p>
    </div>

    <div class="menu-section">
      <h4>🛍️ Marina Shop</h4>
      <p><em>Coming soon — offers and promotions</em></p>
    </div>
  </div>

  <!-- Full-screen PDF chart viewer -->
  <div id="chart-viewer">
    <button id="chart-viewer-close" onclick="closeChartViewer()">✕ Close</button>
    <iframe id="chart-viewer-frame" src=""></iframe>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="local-markers.js?v=2"></script>
  <script src="official-markers.js?v=2"></script>
  <script src="wharves-ramps.js?v=1"></script>
  <script src="gps.js?v=2"></script>
  <script src="map.js?v=3"></script>
  <script src="ui-panel.js?v=3"></script>
</body>
</html>
