name: JavaScript Syntax Check

on:
  push:
    branches: [ main ]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check syntax of all JS files
        run: |
          echo "Checking JavaScript files for syntax errors..."
          error_found=0
          for file in $(find . -name "*.js" -not -path "*/node_modules/*"); do
            echo "Checking $file"
            if ! node --check "$file"; then
              echo "::error file=$file::Syntax error found in $file"
              error_found=1
            fi
          done
          if [ "$error_found" -eq 1 ]; then
            echo "One or more files have syntax errors!"
            exit 1
          fi
          echo "All files passed syntax check!"
